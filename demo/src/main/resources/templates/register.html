<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sistema de Usuarios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            color: #1f2937;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #dc2626;
            background-color: #fee2e2;
            border-left: 4px solid #dc2626;
            padding: 0.75rem;
            border-radius: 4px;
            margin-top: 1rem;
            min-height: 1.5em;
            display: none;
            font-size: 0.9rem;
        }

        .error.show {
            display: block;
        }

        .success {
            color: #059669;
            background-color: #d1fae5;
            border-left: 4px solid #059669;
            padding: 0.75rem;
            border-radius: 4px;
            margin-top: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .success.show {
            display: block;
        }

        .link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .info {
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #1e40af;
            margin-top: 1.5rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📝 Crear Cuenta</h1>
    <p class="subtitle">Regístrate para acceder</p>

    <form id="registerForm">
        <div class="form-group">
            <label for="nombre">Nombre de usuario</label>
            <input type="text" id="nombre" name="nombre" placeholder="ej: juan_perez" required minlength="2" maxlength="75">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required minlength="5" maxlength="100">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="4" maxlength="30">
            </div>

            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="">Selecciona un rol</option>
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="fechaRegistro">Fecha de registro</label>
            <input type="date" id="fechaRegistro" name="fechaRegistro" required>
        </div>

        <button type="submit" id="registerBtn">Crear Cuenta</button>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <p class="link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </p>

        <div class="info">
            ℹ️ Mínimo 2 caracteres en usuario y 4 en contraseña
        </div>
    </form>
</div>

<script>
    const API_BASE = "http://localhost:8080";

    const form = document.getElementById("registerForm");
    const errorDiv = document.getElementById("error");
    const successDiv = document.getElementById("success");
    const registerBtn = document.getElementById("registerBtn");

    // Establecer fecha actual como default
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("fechaRegistro").value = today;

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorDiv.classList.remove("show");
        successDiv.classList.remove("show");
        registerBtn.disabled = true;

        const nombre = document.getElementById("nombre").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const rol = document.getElementById("rol").value;
        const fechaRegistro = document.getElementById("fechaRegistro").value;

        // Validaciones básicas
        if (!nombre || nombre.length < 2) {
            mostrarError("El nombre debe tener al menos 2 caracteres.");
            registerBtn.disabled = false;
            return;
        }

        if (!email || !email.includes("@")) {
            mostrarError("Debes introducir un email válido.");
            registerBtn.disabled = false;
            return;
        }

        if (!password || password.length < 4) {
            mostrarError("La contraseña debe tener al menos 4 caracteres.");
            registerBtn.disabled = false;
            return;
        }

        if (!rol) {
            mostrarError("Debes seleccionar un rol.");
            registerBtn.disabled = false;
            return;
        }

        if (!fechaRegistro) {
            mostrarError("Debes seleccionar una fecha de registro.");
            registerBtn.disabled = false;
            return;
        }

        try {
            // Obtener token de admin para crear usuario
            const loginResponse = await fetch(`${API_BASE}/usuarios/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nombre: "admin" })
            });

            if (!loginResponse.ok) {
                mostrarError("No se pudo obtener permisos para registrar. Contacta con soporte.");
                registerBtn.disabled = false;
                return;
            }

            const loginData = await loginResponse.json();
            const adminToken = loginData.token;

            // Crear nuevo usuario
            const createResponse = await fetch(`${API_BASE}/usuarios`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${adminToken}`
                },
                body: JSON.stringify({
                    nombre: nombre,
                    email: email,
                    contraseña: password,
                    rol: rol,
                    fechaRegistro: fechaRegistro
                })
            });

            if (!createResponse.ok) {
                const errorData = await createResponse.json();
                if (errorData.mensaje) {
                    mostrarError(errorData.mensaje);
                } else {
                    mostrarError("Error al crear la cuenta. Intenta con otro nombre o email.");
                }
                registerBtn.disabled = false;
                return;
            }

            mostrarExito("¡Cuenta creada exitosamente! Redirigiendo al login...");
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);

        } catch (err) {
            mostrarError("Error de conexión: " + err.message);
            registerBtn.disabled = false;
        }
    });

    function mostrarError(msg) {
        errorDiv.textContent = msg;
        errorDiv.classList.add("show");
    }

    function mostrarExito(msg) {
        successDiv.textContent = msg;
        successDiv.classList.add("show");
    }
</script>
</body>
</html>
